#----- Classifier --------------------------------------------------------------

target-class = <class_name>       #         <name-str>      Class name to detect
threshold = 0.75                  # (0.75)  <float-value>   Probability threshold for validated segments
review-thr = 0.0                  # (0)     <float-value>   Lower threshold for review segments; 0 = disabled
batch-size = 4                    # (4)     <imgs-value>    Images per inference batch
deint = 1                         # (1)     <boolean-flag>  Hardware deinterlacing: 0 = off, 1 = on
verbose = 0                       # (0)     <boolean-flag>  Show additional detection and diagnostic messages
log-class-work = 0                # (0)     <boolean-flag>  Save classifier console output
log-class-frames = 0              # (0)     <boolean-flag>  Save per-frame classification probabilities

#----- Encoder -----------------------------------------------------------------

qp = 20                           # (20)    <value>         HEVC encoder quantization parameter
tier = high                       # (high)  <opt-str>       HEVC tier: [main, high]
level = 5.1                       # (5.1)   <opt-str>       HEVC level: [1, 2, 2.1, 3, 3.1, 4, 4.1, 5, 5.1, 5.2, 6, 6.1, 6.2]
edge-trim = 40                    # (40)    <ms-value>      Milliseconds trimmed from both segment edges: [0 ... 1000]
scan-type = auto                  # (auto)  <opt-str>       Video scan type: [auto, detect, progressive, interlaced]
sel-begin = start                 # (start) <time-str>      Correction-range start: start or HH:MM:SS.mmm
sel-end = end                     # (end)   <time-str>      Correction-range end: end or HH:MM:SS.mmm
offset = 0                        # (0)     <ms-value>      Signed A/V shift in milliseconds
audio-delay = 0                   # (0)     <ms-value>      Signed audio-only correction in milliseconds
log-enc-work = 0                  # (0)     <boolean-flag>  Save encoder console output
